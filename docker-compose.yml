services:
  # 1. vLLM Inference Engine (High-Throughput OpenAI API Compatible Engine)
  vllm:
    image: vllm/vllm-openai@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
    container_name: vllm-engine
    restart: always
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - inference
    volumes:
      - /var/lib/vllm/models:/root/.cache/huggingface
    environment:
      - HF_HUB_OFFLINE=1
      - OMP_NUM_THREADS=8
      - VLLM_CONFIGURE_LOGGING=0
      - VLLM_API_KEY=${VLLM_API_KEY:?VLLM_API_KEY must be set}
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - >-
        exec vllm serve
        --model Qwen/Qwen2.5-14B-Instruct
        --revision cf98f3b3bbb457ad9e2bb7baf9a0125b6b88caa8
        --tokenizer-revision cf98f3b3bbb457ad9e2bb7baf9a0125b6b88caa8
        --host 0.0.0.0
        --port 8000
        --kv-cache-memory 68719476736
        --max-model-len 16384
        --max-num-seqs 40
        --quantization fp8
        --kv-cache-dtype fp8
        --enable-prefix-caching
        --served-model-name qwen2.5-14b
        --enable-auto-tool-choice
        --tool-call-parser hermes
        --api-key "$$VLLM_API_KEY"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

  # 2. Giao diện Người dùng & Quản lý RAG (Open WebUI)
  open-webui:
    # Release deployments must set HTMP_OPEN_WEBUI_IMAGE to a registry digest.
    # Lab fallback is not permitted by the release gate.
    image: ${HTMP_OPEN_WEBUI_IMAGE:?HTMP_OPEN_WEBUI_IMAGE must be an immutable registry digest}
    container_name: open-webui
    networks:
      - frontend
      - inference
      - ingestion
      - data
    restart: always
    environment:
      - OPENAI_API_BASE_URLS=http://vllm:8000/v1
      - OPENAI_API_KEY=${VLLM_API_KEY:?VLLM_API_KEY must be set}
      - ENABLE_OPENAI_API=True
      - ENABLE_OLLAMA_API=False
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set}
      - ENABLE_RAG_WEB_SEARCH=False
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
      - RAG_EMBEDDING_ENGINE=huggingface
      - RAG_EMBEDDING_MODEL=BAAI/bge-m3
      - CONTENT_EXTRACTION_ENGINE=tika
      - TIKA_SERVER_URL=http://tika:9998
      - TIKA_SERVER_VERSION=3
      - ENABLE_RAG_HYBRID_SEARCH=True
      - RAG_TOP_K=5
      - RAG_RELEVANCE_THRESHOLD=0.3
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - ENABLE_SIGNUP=False
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-user}
      - HTMP_DB_HOST=${HTMP_DB_HOST:?HTMP_DB_HOST must be set}
      - HTMP_DB_PORT=${HTMP_DB_PORT:-5410}
      - HTMP_DB_NAME=${HTMP_DB_NAME:-3SERP_HTMP_DATA}
      - HTMP_DB_USER=${HTMP_DB_USER:?HTMP_DB_USER must be set}
      - HTMP_DB_PASSWORD=${HTMP_DB_PASSWORD:?HTMP_DB_PASSWORD must be set}
      - HTMP_DB_MAX_ROWS=${HTMP_DB_MAX_ROWS:-200}
      - HTMP_DB_STATEMENT_TIMEOUT_MS=${HTMP_DB_STATEMENT_TIMEOUT_MS:-15000}
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      vllm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # 2B. Apache Tika - Trich xuat noi dung tai lieu
  tika:
    image: apache/tika@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
    container_name: tika
    networks:
      - ingestion
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    command: ["-c", "/tika-config.xml"]
    volumes:
      - ./tika-config.xml:/tika-config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9998/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 3. Qdrant Vector Database (Vector Search hiệu năng cao bằng Rust)
  qdrant:
    image: qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: qdrant-vector-db
    networks:
      - data
    restart: always
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 4. Redis Server (Message Broker cho Celery & Semantic LLM Cache)
  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: redis-broker-cache
    networks:
      - data
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 5. Langfuse Postgres Database (Lưu dữ liệu Tracing LLM)
  langfuse-db:
    image: postgres@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    container_name: langfuse-db
    networks:
      - observability
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 6. Langfuse Web Server (Giao diện Observability & Trace LLM Agent)
  langfuse-web:
    image: ghcr.io/langfuse/langfuse@sha256:85c278dcab96c15db94191a5c1664f85aba2d7fb6771a00e99681c902c4b7015
    container_name: langfuse-server
    networks:
      - observability
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@langfuse-db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      - SALT=${SALT:?SALT must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - NEXTAUTH_URL=http://localhost:3001
      - TELEMETRY_ENABLED=false
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'const os=require(\"os\"); require(\"http\").get(\"http://\" + os.hostname() + \":3000/api/public/health\", (res) => { process.exit(res.statusCode === 200 ? 0 : 1); });'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  # 7. Nginx Gateway (TLS/SSL Reverse Proxy & SSE Streaming)
  nginx:
    image: nginx@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    container_name: nginx-gateway
    networks:
      - frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      open-webui:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --no-check-certificate -q https://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  open-webui-data:
    driver: local
  qdrant-data:
    driver: local
  redis-data:
    driver: local
  langfuse-db-data:
    driver: local

networks:
  frontend:
    driver: bridge
  inference:
    driver: bridge
    internal: true
  ingestion:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  observability:
    driver: bridge
    internal: true
