				'Choose whether the app opens to the default home or chat view.': 'Chọn mở ứng dụng ở trang chủ mặc định hay khung chat.',
				'Chat Direction': 'Hướng văn bản',
				'Landing Page': 'Trang khởi đầu',
				'Chat Background Image': 'Hình nền trò chuyện',
				'User Location': 'Vị trí người dùng'
			};

			const translateTextNodes = (root) => {
				const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
				let node;
				while ((node = walker.nextNode())) {
					const trimmed = node.nodeValue?.trim();
					if (trimmed && dict[trimmed]) {
						node.nodeValue = node.nodeValue.replace(trimmed, dict[trimmed]);
					}
				}
			};

			const fixInputsAndTranslate = () => {
				document.querySelectorAll('input[type="email"]').forEach((el) => {
					el.type = 'text';
					el.setAttribute('autocomplete', 'username');
					if (!el.dataset.patched) {
						el.dataset.patched = '1';
						if (el.placeholder && /email/i.test(el.placeholder)) {
							el.placeholder = 'Nhập mã nhân viên (VD: HP0001)';
						}
					}
				});
				document.querySelectorAll('form').forEach((form) => {
					form.setAttribute('novalidate', 'true');
				});
				translateTextNodes(document.body || document.documentElement);
			};

			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', fixInputsAndTranslate);
			} else {
				fixInputsAndTranslate();
			}
			const observer = new MutationObserver(fixInputsAndTranslate);
			observer.observe(document.documentElement, { childList: true, subtree: true });
		})();

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				// LICENSE covers these Open WebUI splash logo assets.
				// Do not alter, remove, obscure, or replace them except as LICENSE permits:
				// https://docs.openwebui.com/license.
				const preloadHref = document.documentElement.classList.contains('dark')
					? '/static/splash-dark.png'
					: '/static/splash.png';
				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'image';
				preload.href = preloadHref;
				preload.setAttribute('fetchpriority', 'high');
				document.head.appendChild(preload);

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
				const isDarkMode = document.documentElement.classList.contains('dark');

				const logo = document.createElement('img');
				logo.id = 'logo';
				logo.style =
					'position: absolute; width: auto; height: 6rem; top: 44%; left: 50%; transform: translateX(-50%); display:block;';
				logo.loading = 'eager';
				logo.fetchPriority = 'high';
				// LICENSE covers this Open WebUI splash logo.
				// Do not alter, remove, obscure, or replace it except as LICENSE permits:
				// https://docs.openwebui.com/license.
				logo.src = isDarkMode ? '/static/splash-dark.png' : '/static/splash.png';

				document.addEventListener('DOMContentLoaded', function () {
					const splash = document.getElementById('splash-screen');
					if (document.documentElement.classList.contains('her')) {
						return;
					}

					if (splash) splash.prepend(logo);
				});
			})();
		</script>

		<script>
			// The chat UI calls these around each assistant response.
			(() => {
				let activeRequests = 0;
				let indicator;
				let positionFrame;
				let errorCountAtShow = 0;
				const responseErrorPattern = /Invalid input\[|Unauthorized|Uh-oh! There was an issue with the response|Server Connection Error/gi;
				const countResponseErrors = () => (document.body?.innerText.match(responseErrorPattern) || []).length;
				const clearIndicator = () => {
					activeRequests = 0;
					if (indicator) indicator.remove();
					indicator = undefined;
				};

				const positionIndicator = () => {
					if (!indicator) return;
					const candidates = [...document.querySelectorAll('span, div, p')]
						.filter((element) => !element.closest('button') && /^(gpt|qwen|claude|gemini|llama|mistral)[\w.-]*$/i.test(element.textContent.trim()))
						.map((element) => ({ element, rect: element.getBoundingClientRect() }))
						.filter(({ rect }) => rect.width > 0 && rect.top >= 0 && rect.top < window.innerHeight - 150);
					if (!candidates.length) return;
					const latestTop = Math.max(...candidates.map(({ rect }) => rect.top));
					const anchor = candidates
						.filter(({ rect }) => Math.abs(rect.top - latestTop) < 4)
						.sort((a, b) => a.rect.width - b.rect.width)[0].rect;
					indicator.style.left = `${Math.round(anchor.left)}px`;
					indicator.style.top = `${Math.round(anchor.bottom + 2)}px`;
					indicator.style.transform = 'none';
				};

				const schedulePosition = () => {
					cancelAnimationFrame(positionFrame);
					positionFrame = requestAnimationFrame(positionIndicator);
				};

				const showIndicator = () => {
					activeRequests += 1;
					if (indicator || !document.body) return;
					errorCountAtShow = countResponseErrors();
					indicator = document.createElement('div');
					indicator.setAttribute('role', 'status');
					indicator.setAttribute('aria-live', 'polite');
					indicator.style.cssText = 'position:fixed;top:18vh;left:50%;transform:translateX(-50%);z-index:99999;display:flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid rgba(59,130,246,.2);border-radius:999px;background:rgba(255,255,255,.94);color:#334155;box-shadow:0 2px 9px rgba(15,23,42,.1);backdrop-filter:blur(8px);font:500 12px/1.25 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.01em;white-space:nowrap;pointer-events:none';
					if (document.documentElement.classList.contains('dark')) {
						indicator.style.background = 'rgba(30,41,59,.94)';
						indicator.style.color = '#e2e8f0';
					}
					const spinner = document.createElement('span');
					spinner.style.cssText = 'width:13px;height:13px;border:2px solid rgba(59,130,246,.18);border-top-color:#3b82f6;border-radius:50%;animation:htmp-image-spin .8s linear infinite;flex:none';
					const label = document.createElement('span');
					label.textContent = 'Đang xử lý…';
					indicator.append(spinner, label);
					document.body.appendChild(indicator);
					schedulePosition();
				};

				const hideIndicator = () => {
					activeRequests = Math.max(0, activeRequests - 1);
					if (activeRequests === 0 && indicator) {
						indicator.remove();
						indicator = undefined;
					}
				};

				const style = document.createElement('style');
				style.textContent = '@keyframes htmp-image-spin{to{transform:rotate(360deg)}}';
				document.head.appendChild(style);
				const errorObserver = new MutationObserver(() => {
					if (indicator && countResponseErrors() > errorCountAtShow) clearIndicator();
				});
				errorObserver.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
				window.addEventListener('htmp-chat-start', showIndicator);
				window.addEventListener('htmp-chat-finish', hideIndicator);
				window.addEventListener('scroll', schedulePosition, true);
				window.addEventListener('resize', schedulePosition);
			})();
		</script>
