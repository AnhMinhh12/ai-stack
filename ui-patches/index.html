		// Tự động Việt hóa các nhãn/mô tả còn sót tiếng Anh và cho phép đăng nhập bằng Mã nhân viên
		(() => {
			const dict = {
				'Choose the color theme used by the interface.': 'Chọn chủ đề màu sắc cho giao diện.',
				'Choose the language used for interface text.': 'Chọn ngôn ngữ hiển thị giao diện.',
				'Set the default system prompt for new chats.': 'Đặt prompt hệ thống mặc định cho các đoạn chat mới.',
				'Model parameters': 'Tham số mô hình',
				'Show or hide custom generation parameters.': 'Hiển thị hoặc ẩn các tham số sinh phản hồi tùy chỉnh.',
				'Personal': 'Cá nhân',
				'Basics': 'Cơ bản',
				'Preferences': 'Tùy chọn',
				'Keyboard': 'Bàn phím',
				'Services': 'Dịch vụ',
				'Data': 'Dữ liệu',
				'Data Controls': 'Kiểm soát dữ liệu',
				'Usage': 'Mức sử dụng',
				'Profile': 'Hồ sơ',
				'System': 'Hệ thống',
				'Choose a dedicated model for context compaction summaries. Current Model follows the active chat model.': 'Chọn mô hình chuyên dụng để tóm tắt nén ngữ cảnh. Mô hình hiện tại theo mô hình chat đang dùng.',
				'Choose the browser voice used for speech output.': 'Chọn giọng đọc trình duyệt cho âm thanh.',
				'Choose the configured text-to-speech service voice.': 'Chọn giọng đọc dịch vụ chuyển văn bản thành giọng nói.',
				'Choose the engine used to read assistant responses aloud.': 'Chọn công cụ để đọc to phản hồi của trợ lý.',
				'Choose the engine used to transcribe voice input.': 'Chọn công cụ để chuyển đổi giọng nói đầu vào thành văn bản.',
				'Choose the gender value stored on your profile.': 'Chọn giới tính lưu trong hồ sơ của bạn.',
				'Choose whether Enter sends immediately or uses Ctrl+Enter.': 'Chọn gửi tin nhắn bằng Enter hoặc Ctrl+Enter.',
				'Choose whether the app opens to the default home or chat view.': 'Chọn mở ứng dụng ở trang chủ mặc định hay khung chat.',
				'Chat Direction': 'Hướng văn bản',
				'Landing Page': 'Trang khởi đầu',
				'Chat Background Image': 'Hình nền trò chuyện',
				'User Location': 'Vị trí người dùng'
			};

			const translateTextNodes = (root) => {
				const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
				let node;
				while ((node = walker.nextNode())) {
					const trimmed = node.nodeValue?.trim();
					if (!trimmed) continue;
					if (dict[trimmed]) {
						node.nodeValue = node.nodeValue.replace(trimmed, dict[trimmed]);
					} else if (trimmed === 'View Result from ask_erp' || trimmed.includes('View Result from ask_erp')) {
						node.nodeValue = node.nodeValue.replace(/View Result from ask_erp/g, 'Đã truy xuất CSDL ERP (ask_erp)');
					} else if (trimmed.startsWith('View Result from')) {
						node.nodeValue = node.nodeValue.replace(/View Result from/g, 'Xem kết quả từ');
					} else if (trimmed === 'Executing ask_erp...' || trimmed.includes('Executing ask_erp...')) {
						node.nodeValue = node.nodeValue.replace(/Executing ask_erp\.\.\./g, 'Đang truy xuất CSDL ERP HTMP...');
					} else if (trimmed.startsWith('Executing')) {
						node.nodeValue = node.nodeValue.replace(/Executing/g, 'Đang thực thi');
					} else if (trimmed === 'Preparing ask_erp...' || trimmed.includes('Preparing ask_erp...')) {
						node.nodeValue = node.nodeValue.replace(/Preparing ask_erp\.\.\./g, 'Chuẩn bị tra cứu ERP...');
					} else if (trimmed.startsWith('Preparing')) {
						node.nodeValue = node.nodeValue.replace(/Preparing/g, 'Đang chuẩn bị');
					}
				}
			};

			const fixInputsAndTranslate = () => {
				document.querySelectorAll('input[type="email"]').forEach((el) => {
					el.type = 'text';
					el.setAttribute('autocomplete', 'username');
					if (!el.dataset.patched) {
						el.dataset.patched = '1';
						if (el.placeholder && /email/i.test(el.placeholder)) {
							el.placeholder = 'Nhập mã nhân viên (VD: HP0001)';
						}
					}
				});
				document.querySelectorAll('form').forEach((form) => {
					form.setAttribute('novalidate', 'true');
				});
				translateTextNodes(document.body || document.documentElement);
			};

			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', fixInputsAndTranslate);
			} else {
				fixInputsAndTranslate();
			}
			const observer = new MutationObserver(fixInputsAndTranslate);
			observer.observe(document.documentElement, { childList: true, subtree: true });
		})();

		<script>
			function resizeIframe(obj) {
				try {
					obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
				} catch (e) {}
			}
			window.addEventListener('message', function(e) {
				if (e.data && e.data.type === 'iframe:height' && e.data.height) {
					const iframes = document.querySelectorAll('iframe');
					for (const iframe of iframes) {
						if (iframe.contentWindow === e.source) {
							iframe.style.height = e.data.height + 'px';
							break;
						}
					}
				}
			});
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				// LICENSE covers these Open WebUI splash logo assets.
				// Do not alter, remove, obscure, or replace them except as LICENSE permits:
				// https://docs.openwebui.com/license.
				const preloadHref = document.documentElement.classList.contains('dark')
					? '/static/splash-dark.png'
					: '/static/splash.png';
				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'image';
				preload.href = preloadHref;
				preload.setAttribute('fetchpriority', 'high');
				document.head.appendChild(preload);

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
				const isDarkMode = document.documentElement.classList.contains('dark');

				const logo = document.createElement('img');
				logo.id = 'logo';
				logo.style =
					'position: absolute; width: auto; height: 6rem; top: 44%; left: 50%; transform: translateX(-50%); display:block;';
				logo.loading = 'eager';
				logo.fetchPriority = 'high';
				// LICENSE covers this Open WebUI splash logo.
				// Do not alter, remove, obscure, or replace it except as LICENSE permits:
				// https://docs.openwebui.com/license.
				logo.src = isDarkMode ? '/static/splash-dark.png' : '/static/splash.png';

				document.addEventListener('DOMContentLoaded', function () {
					const splash = document.getElementById('splash-screen');
					if (document.documentElement.classList.contains('her')) {
						return;
					}

					if (splash) splash.prepend(logo);
				});

				// Đồng bộ theme (dark/light) sang tất cả các iframe Rich UI nhúng trong chat
				const iframeThemes = new WeakMap();
				document.addEventListener('load', (event) => {
					if (event.target instanceof HTMLIFrameElement && event.target.contentWindow) {
						iframeThemes.delete(event.target.contentWindow);
					}
				}, true);
				window.addEventListener('message', (e) => {
					if (e.data && (e.data.type === 'iframe:height' || e.data.themeRequest || e.data.type === 'erp:init')) {
						const isDark = document.documentElement.classList.contains('dark') || !document.documentElement.classList.contains('light');
						const theme = isDark ? 'dark' : 'light';
						if (e.source && e.source.postMessage && iframeThemes.get(e.source) !== theme) {
							try {
								iframeThemes.set(e.source, theme);
								e.source.postMessage({ type: 'erp:theme', theme }, '*');
							} catch (err) {}
						}
					}
				});
				if (window.MutationObserver) {
					new MutationObserver(() => {
